name: Azure Static Web Apps CI/CD - urbis-site

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - master

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy urbis-site
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build urbis-site (Vite SSG)
        run: pnpm turbo run build --filter=urbis-site   # ajuste o --filter se o nome do pacote for diferente (veja package.json de apps/site)

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SALMON_BEACH_081268510 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}           # útil para comentários em PRs
          action: "upload"
          ###### Repository/Build Configurations ######
          app_location: "/"                                 # raiz do repositório clonado
          api_location: ""                                  # sem API (se adicionar Functions depois, mude aqui)
          output_location: "apps/site/dist"                 # pasta padrão do Vite build (confirme localmente)
          skip_app_build: true                              # build já feito manualmente via turbo/vite
          ###### End of Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SALMON_BEACH_081268510 }}
          action: "close"
