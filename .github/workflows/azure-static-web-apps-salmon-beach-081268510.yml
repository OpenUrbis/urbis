name: Azure Static Web Apps CI/CD - Urbis Site

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - master

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Site (Next.js)
        run: pnpm turbo run build --filter=@open-urbis/site   # ← ajuste o nome do pacote se necessário (veja no package.json de apps/site)

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SALMON_BEACH_081268510 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}           # opcional, mas útil para comentários em PR
          action: "upload"
          ###### Repository/Build Configurations ######
          app_location: "/"                                 # raiz do repo clonado
          api_location: ""                                  # sem API por enquanto
          output_location: "apps/site/.next"                # ← mude para "apps/site/out" se usar next export
          skip_app_build: true                              # pulamos build dentro da action (já fizemos com turbo)
          ###### End of Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SALMON_BEACH_081268510 }}
          action: "close"
