name: Deploy Urbis Docs

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - master

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy urbis-docs
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          pnpm config set node-linker hoisted
          pnpm install --frozen-lockfile

      - name: Build urbis-docs (Next.js Standalone)
        run: |
          pnpm turbo run build --filter=@open-urbis/map-docs
          
          # No monorepo com standalone, o Next.js gera uma estrutura complexa em .next/standalone.
          # Para o Azure SWA detectar corretamente o Next.js, precisamos que o package.json e o .next estejam na raiz do app_location.
          
          mkdir -p deploy-docs
          
          # Copiar o core do standalone
          cp -r apps/docs/.next/standalone/* deploy-docs/
          
          # Mover o conteúdo da app para a raiz do deploy-docs para simplificar para o SWA
          # Estrutura inicial em deploy-docs: node_modules/, apps/docs/{server.js, .next/, etc}
          cp -r deploy-docs/apps/docs/* deploy-docs/
          rm -rf deploy-docs/apps
          
          # Copiar assets estáticos e públicos para a raiz do deploy-docs (onde o server.js e .next agora estão)
          mkdir -p deploy-docs/.next/static
          cp -r apps/docs/.next/static/* deploy-docs/.next/static/
          
          # Lidar com a pasta public (pode ser arquivo ou pasta dependendo do conteúdo)
          if [ -d "apps/docs/public" ]; then
            cp -r apps/docs/public/* deploy-docs/public/ 2>/dev/null || cp -r apps/docs/public deploy-docs/
          fi
          
          # Copiar arquivos de configuração do SWA para a pasta de deploy
          cp apps/docs/staticwebapps.config.json deploy-docs/ 2>/dev/null || true
          
          # Garantir que o package.json e next.config.mjs estejam na raiz para o SWA detector
          cp apps/docs/package.json deploy-docs/
          cp apps/docs/next.config.mjs deploy-docs/ || true
          
          # O SWA as vezes exige um index.html para sites "estáticos" se ele falhar em detectar o framework.
          # Como estamos em modo standalone (SSR), o SWA deveria detectar o Next.js, mas o index.html garante que ele n reclame de pasta vazia.
          echo "<!-- SWA Next.js Standalone Mode -->" > deploy-docs/index.html

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BRAVE_SMOKE_097CB1810 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          ###### Repository/Build Configurations ######
          app_location: "deploy-docs" # Pasta preparada com a estrutura correta
          api_location: "" # Standalone lida com a API internamente
          output_location: "" # Deixar SWA detectar o build
          skip_app_build: true
          ###### End of Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BRAVE_SMOKE_097CB1810 }}
          action: "close"
