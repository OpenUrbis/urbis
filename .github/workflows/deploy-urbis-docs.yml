name: Deploy Urbis Docs

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - master

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy urbis-docs
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          pnpm config set node-linker hoisted
          pnpm install --frozen-lockfile

      - name: Build urbis-docs (Next.js Standalone)
        run: |
          pnpm turbo run build --filter=@open-urbis/map-docs
          
          # Preparar os assets dentro da pasta standalone para o servidor Next.js
          mkdir -p apps/docs/.next/standalone/urbis/apps/docs/.next
          cp -r apps/docs/.next/static apps/docs/.next/standalone/urbis/apps/docs/.next/static
          cp -r apps/docs/public apps/docs/.next/standalone/urbis/apps/docs/public
          
          # Copiar configuração do SWA para onde o SWA Action vai ler (raiz do app_location)
          cp apps/docs/staticwebapps.config.json apps/docs/.next/standalone/urbis/apps/docs/
          
          # SWA Action exige um index.html se não detectar Next.js automaticamente.
          # Vamos criar um arquivo dummy para passar na validação de "app artifacts".
          echo "<!-- SWA Entry Point -->" > apps/docs/.next/standalone/urbis/apps/docs/index.html
          
          # Manter o package.json gerado pelo Next.js standalone mas remover as dependências complexas
          # que causam erro no npm install do Azure. O arquivo standalone/.next/standalone/urbis/apps/docs/package.json
          # já existe, mas vamos garantir que ele seja "limpo" para o Azure não tentar instalar nada.
          # Usamos jq para limpar se disponível, ou apenas sobrescrevemos com o essencial.
          echo '{"name":"docs","version":"0.0.0","scripts":{"start":"node server.js"}}' > apps/docs/.next/standalone/urbis/apps/docs/package.json

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BRAVE_SMOKE_097CB1810 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          ###### Repository/Build Configurations ######
          app_location: "apps/docs/.next/standalone/urbis/apps/docs"
          api_location: ""
          output_location: "" # Deixamos vazio para o SWA considerar a pasta de artifacts como a raiz
          skip_app_build: true
          skip_api_build: true
          is_static_export: false
          ###### End of Configurations ######
        env:
          # Reforçar para o SWA Action não tentar buildar nada
          SKIP_APP_BUILD: "true"
          SKIP_API_BUILD: "true"
          SKIP_NPM_INSTALL: "true"
          DEPLOYMENT_ENABLE_ORYX_BUILD: "false"
