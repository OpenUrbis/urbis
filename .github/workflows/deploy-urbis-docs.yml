name: Deploy Urbis Docs

on:
  push:
    branches:
      - master
      - feat/docs-swa-standalone
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - master
      - feat/docs-swa-standalone

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy urbis-docs
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build urbis-docs
        env:
          VITE_API_URL: https://api.mapa.urbis.prefeitura.sp.gov.br
        run: pnpm turbo run build --filter=@open-urbis/map-docs

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BRAVE_SMOKE_097CB1810 }}
          action: "upload"
          ###### Repository/Build Configurations ######
          app_location: "apps/docs/out"
          api_location: ""
          output_location: ""
          skip_app_build: true
          ###### End of Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BRAVE_SMOKE_097CB1810 }}
          action: "close"
