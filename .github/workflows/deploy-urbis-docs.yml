name: Deploy Urbis Docs

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - master

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy urbis-docs
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          pnpm config set node-linker hoisted
          pnpm install --frozen-lockfile

      - name: Build urbis-docs (Next.js Standalone)
        run: |
          pnpm turbo run build --filter=@open-urbis/map-docs
          
          # Preparar bundle standalone para o SWA seguindo a estrutura validada localmente
          mkdir -p deploy-docs
          
          # 1. Copiar o servidor standalone e dependências resolvendo symlinks
          cp -rL apps/docs/.next/standalone/. deploy-docs/
          
          # 2. Achatamento: Trazer o conteúdo de urbis/apps/docs para a raiz do deploy
          if [ -d "deploy-docs/urbis/apps/docs" ]; then
            cp -rL deploy-docs/urbis/apps/docs/. deploy-docs/
            rm -rf deploy-docs/urbis
          fi
          
          # 3. Injetar assets estáticos (.next/static e public) onde o server.js espera
          mkdir -p deploy-docs/.next/static
          cp -rL apps/docs/.next/static/. deploy-docs/.next/static/
          cp -rL apps/docs/public/. deploy-docs/public/
          
          # 4. Configuração SWA
          cp apps/docs/staticwebapps.config.json deploy-docs/
          # Usar o package.json original mas limpar protocolos workspace:*
          cp apps/docs/package.json deploy-docs/
          sed -i 's/workspace:\*/*/g' deploy-docs/package.json

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BRAVE_SMOKE_097CB1810 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          ###### Repository/Build Configurations ######
          app_location: "deploy-docs" # Pasta preparada com tudo na raiz
          api_location: ""
          output_location: "" # Deixamos vazio para o SWA aceitar o app_location como a raiz do site
          skip_app_build: true
          skip_api_build: true
          ###### End of Configurations ######
