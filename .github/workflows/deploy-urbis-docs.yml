name: Deploy Urbis Docs

on:
  push:
    branches:
      - master
      - feat/docs-swa-standalone
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - master
      - feat/docs-swa-standalone

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy urbis-docs
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          pnpm config set node-linker hoisted
          pnpm install --frozen-lockfile

      - name: Build urbis-docs
        env:
          VITE_API_URL: https://api.mapa.urbis.sampa.br
        run: |
          pnpm turbo run build --filter=@open-urbis/map-docs
          # Next.js 16 standalone structure fix for monorepo
          # Note: structure might be .next/standalone/urbis/apps/docs
          if [ -d "apps/docs/.next/standalone/urbis/apps/docs" ]; then
            cp -r apps/docs/.next/standalone/urbis/apps/docs/. apps/docs/.next/standalone/
          elif [ -d "apps/docs/.next/standalone/apps/docs" ]; then
            cp -r apps/docs/.next/standalone/apps/docs/. apps/docs/.next/standalone/
          fi
          
          cp -r apps/docs/public apps/docs/.next/standalone/public || true
          mkdir -p apps/docs/.next/standalone/.next
          cp -r apps/docs/.next/static apps/docs/.next/standalone/.next/static || true
          cp apps/docs/package.json apps/docs/.next/standalone/package.json
          cp apps/docs/staticwebapp.config.json apps/docs/.next/standalone || true
          rm -rf apps/docs/.next/standalone/node_modules/.pnpm

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BRAVE_SMOKE_097CB1810 }}
          action: "upload"
          ###### Repository/Build Configurations ######
          app_location: "apps/docs"
          api_location: ""
          output_location: ""
          skip_app_build: true
          skip_api_build: true
          ###### End of Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WITTY_WATER_09D2CCE10 }}
          action: "close"
