name: Deploy Urbis Map

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - master

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy urbis-map
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build urbis-map (Vite SPA)
        run: pnpm turbo run build --filter=@open-urbis/map-web
        env:
          VITE_API_URL: https://api.mapa.urbis.prefeitura.sp.gov.br
          VITE_OIDC_AUTHORITY: https://api.mapa.urbis.prefeitura.sp.gov.br/auth/oidc
          VITE_OIDC_CLIENT_ID: 94a86322-269e-44df-803a-534c0382215d
          VITE_OIDC_REDIRECT_URI: https://mapa.urbis.prefeitura.sp.gov.br/callback
          VITE_S3_ENDPOINT_PUBLIC: https://files.mapa.urbis.prefeitura.sp.gov.br/public
          VITE_PUBLIC_MAPBOX_ACCESS_TOKEN: pk.eyJ1IjoiZG91Z2xhc2RtOTciLCJhIjoiY2ticzc1bm1rMDBxdDMwcDlpb2JoZ2ZmbiJ9.CsAcBQMHNk0vM_u9VXqkhQ

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_GRASS_0CFD53C10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          ###### Repository/Build Configurations ######
          app_location: "apps/web/dist"
          api_location: ""
          output_location: ""
          skip_app_build: true
          ###### End of Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_GRASS_0CFD53C10 }}
          action: "close"
