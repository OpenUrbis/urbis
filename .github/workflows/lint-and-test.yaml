name: CI Pipeline

# Runs on pushes and pull requests for all branches
on:
  push:
    branches:
      - '*'
      - 'feature/**'
      - 'feat/**'
  pull_request:
    branches:
      - '*'
      - 'feature/**'
      - 'feat/**'

env:
  NODE_VERSION: '20' # Adjust according to your Node.js version
  NODE_OPTIONS: '--max-old-space-size=4096'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Checks out the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install pnpm
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: false

      # Sets up Node.js with pnpm cache
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      # Installs dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Restore Turborepo cache before build, lint, and tests
      - name: Setup Turborepo cache
        uses: actions/cache@v4
        with:
          path: |
            .turbo
            node_modules/.cache/turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # Builds with Turborepo
      - name: Build
        run: pnpm exec turbo run build --concurrency=2

      # Runs linting
      - name: Run lint
        run: pnpm exec turbo run lint

      # Runs tests
      - name: Run tests
        run: pnpm test
