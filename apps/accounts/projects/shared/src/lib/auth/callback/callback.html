<div class="callback-page text-center">
  <div class="callback-content">
    @if (loading && errorMessage == undefined) {
      <div class="callback-loading">
        <mat-spinner diameter="32"></mat-spinner>
      </div>
    }
    @if (errorMessage) {
      <div>
        <h1 style="font-size: 72px" class="mb-4">:(</h1>
        <h4>{{ "pages.auth.callback.title" | translate }}</h4>
        <p>
          {{ errorMessage }}
        </p>
        <p>{{ "pages.auth.callback.description" | translate }}</p>
        <div class="mt-4">
          <a
            mat-flat-button
            color="primary"
            routerLink="/"
            [attr.aria-label]="'pages.auth.callback.button' | translate"
          >
            {{ "pages.auth.callback.button" | translate }}
          </a>
        </div>
      </div>
    }
  </div>
</div>
