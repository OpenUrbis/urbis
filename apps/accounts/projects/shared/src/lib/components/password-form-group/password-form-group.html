@if (formGroup()) {
  <div [formGroup]="formGroup()">
    <mat-form-field appearance="outline">
      <mat-label>Senha</mat-label>
      <input
        autofocus
        matInput
        [type]="hidePassword() ? 'password' : 'text'"
        formControlName="password"
      />
      <a
        mat-icon-button
        matSuffix
        (click)="hidePassword.set(!hidePassword())"
        [attr.aria-label]="'Hide password'"
        [attr.aria-pressed]="hidePassword()"
      >
        <mat-icon class="material-symbols-outlined">{{
          hidePassword() ? "visibility_off" : "visibility"
        }}</mat-icon>
      </a>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label> Confirmar senha </mat-label>
      <input
        matInput
        [type]="hidePassword() ? 'password' : 'text'"
        formControlName="confirmPassword"
      />
      <a
        mat-icon-button
        matSuffix
        (click)="hidePassword.set(!hidePassword())"
        [attr.aria-label]="'Hide password'"
        [attr.aria-pressed]="hidePassword()"
      >
        <mat-icon class="material-symbols-outlined">{{
          hidePassword() ? "visibility_off" : "visibility"
        }}</mat-icon>
      </a>
    </mat-form-field>
  </div>
  <div class="error">
    <ng-content></ng-content>
  </div>
  <div class="mb-4">
    <lib-hint-error
      [control]="formGroup().get('password')"
      [errorKeys]="['minlength', 'required']"
    >
      Use pelo menos 8 caracteres.
    </lib-hint-error>
    <lib-hint-error
      [control]="formGroup().get('password')"
      [errorKeys]="['uppercaseLetter']"
    >
      Inclua pelo menos uma letra MAIÚSCULA.
    </lib-hint-error>
    <lib-hint-error
      [control]="formGroup().get('password')"
      [errorKeys]="['lettersAndNumbers']"
    >
      Inclua pelo menos um número e uma letra.
    </lib-hint-error>
    <lib-hint-error [control]="formGroup()" [errorKeys]="['equalPasswords']">
      As senhas não conferem.
    </lib-hint-error>
  </div>
}
