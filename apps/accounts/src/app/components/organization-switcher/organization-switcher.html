<lib-loading-content [loading]="loading()">
  <div class="flex flex-col border border-border rounded-lg divide-y divide-border overflow-hidden">
    @for (item of organizations(); track item.id) {
      <button
        type="button"
        class="flex flex-col w-full text-left p-4 hover:bg-muted/50 transition-colors focus:outline-none focus:bg-muted/50"
        (click)="select(item)"
      >
        <span class="font-medium text-sm">{{ item.name }}</span>
        @if (item.description) {
          <span class="text-xs text-muted-foreground mt-1">{{ item.description }}</span>
        }
      </button>
    }
  </div>
</lib-loading-content>
