<form [formGroup]="form" class="flex flex-col gap-6" (ngSubmit)="submit()">
  <div class="flex flex-col gap-1.5">
    <label hlmLabel for="oldPassword">{{
      "pages.profile.edit.password.fields.currentPassword" | translate
    }}</label>
    <input
      hlmInput
      id="oldPassword"
      formControlName="oldPassword"
      type="password"
      [attr.aria-label]="
        'pages.profile.edit.password.fields.currentPassword' | translate
      "
    />
  </div>

  <lib-password-form-group [formGroup]="form" />

  <div class="flex justify-end pt-4">
    <button
      hlmBtn
      [attr.aria-label]="'pages.profile.edit.password.buttons.save' | translate"
    >
      {{ "pages.profile.edit.password.buttons.save" | translate }}
    </button>
  </div>
</form>
