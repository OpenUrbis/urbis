<form [formGroup]="form" class="profile-form" (ngSubmit)="submit()">
  <mat-form-field appearance="outline">
    <mat-label>Senha atual</mat-label>
    <input matInput formControlName="oldPassword" type="password" />
  </mat-form-field>

  <lib-password-form-group [formGroup]="form" />

  <button matButton="filled">Salvar</button>
</form>
