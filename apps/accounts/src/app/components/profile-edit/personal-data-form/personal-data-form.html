<form [formGroup]="form" class="flex flex-col gap-6" (ngSubmit)="submit()">
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <div class="flex flex-col gap-1.5">
      <label hlmLabel for="firstName">{{
        "pages.profile.edit.personal.fields.firstName" | translate
      }}</label>
      <input
        hlmInput
        id="firstName"
        formControlName="firstName"
        [attr.aria-label]="
          'pages.profile.edit.personal.fields.firstName' | translate
        "
      />
    </div>

    <div class="flex flex-col gap-1.5">
      <label hlmLabel for="lastName">{{
        "pages.profile.edit.personal.fields.lastName" | translate
      }}</label>
      <input
        hlmInput
        id="lastName"
        formControlName="lastName"
        [attr.aria-label]="
          'pages.profile.edit.personal.fields.lastName' | translate
        "
      />
    </div>
  </div>

  <div class="flex flex-col gap-1.5">
    <label hlmLabel for="socialName">{{ "common.fields.socialName" | translate }}</label>
    <input hlmInput id="socialName" formControlName="socialName" />
  </div>

  <!-- Address Section -->
  <div class="flex flex-col gap-4">
    <div class="flex items-center gap-3 p-3 bg-muted/20 rounded-lg border border-border">
      <hlm-switch
        id="noOfficialAddress"
        [checked]="noOfficialAddress()"
        (changed)="noOfficialAddress.set($event)">
      </hlm-switch>
      <label (click)="noOfficialAddress.set(!noOfficialAddress())" class="text-sm font-semibold cursor-pointer">
        {{ 'pages.signUp.form.noOfficialAddress' | translate }}
      </label>
    </div>

    @if (!noOfficialAddress()) {
      <div [formGroup]="$any(form.get('address'))" class="flex flex-col gap-4 animate-in fade-in duration-300">
        <div class="flex flex-col gap-1.5 relative">
          <label hlmLabel for="cep">{{ "common.fields.cep" | translate }}</label>
          <div class="relative">
            <input hlmInput id="cep" placeholder="00000-000" formControlName="cep"
              class="w-full pr-10" (blur)="checkCep()" />
            @if (loadingCep()) {
              <span class="absolute right-3 top-2.5 h-4 w-4 border-2 border-primary border-t-transparent rounded-full animate-spin"></span>
            }
          </div>
        </div>

        <div class="flex flex-col gap-1.5">
          <label hlmLabel for="street">{{ "common.fields.street" | translate }}</label>
          <input hlmInput id="street" formControlName="street" />
        </div>

        <div class="grid grid-cols-3 gap-3">
          <div class="flex flex-col gap-1.5 col-span-1">
            <label hlmLabel for="number">{{ "common.fields.number" | translate }}</label>
            <input hlmInput id="number" placeholder="Nº" formControlName="number" />
          </div>
          <div class="flex flex-col gap-1.5 col-span-2">
            <label hlmLabel for="complement">{{ "common.fields.complement" | translate }}</label>
            <input hlmInput id="complement" placeholder="Apt, bloco..." formControlName="complement" />
          </div>
        </div>

        <div class="flex flex-col gap-1.5">
          <label hlmLabel for="neighborhood">{{ "common.fields.neighborhood" | translate }}</label>
          <input hlmInput id="neighborhood" formControlName="neighborhood" />
        </div>

        <div class="grid grid-cols-4 gap-3">
          <div class="flex flex-col gap-1.5 col-span-3">
            <label hlmLabel for="city">{{ "common.fields.city" | translate }}</label>
            <input hlmInput id="city" formControlName="city" />
          </div>
          <div class="flex flex-col gap-1.5 col-span-1">
            <label hlmLabel for="state">{{ "common.fields.state" | translate }}</label>
            <input hlmInput id="state" placeholder="UF" formControlName="state" />
          </div>
        </div>
      </div>
    } @else {
      <div class="flex flex-col gap-4 animate-in fade-in duration-300">
        <div class="flex flex-row items-center gap-3 p-4 bg-primary rounded-lg border border-primary/20 shadow-inner">
          <img src="endereco_digital_logo.png" alt="Endereço Digital" class="h-12 w-auto brightness-0 invert" />
          <div class="flex flex-col flex-1">
            <p class="text-xs text-white font-bold leading-tight drop-shadow-sm">
              {{ 'pages.signUp.form.digitalAddressDescription' | translate }}
            </p>
            <a hlmBtn href="/" target="_blank" variant="secondary" size="sm" class="h-8 mt-2 gap-1.5 text-xs font-bold w-fit bg-white text-primary hover:bg-white/90 border-0 shadow-sm">
              <hlm-icon name="lucideMap" size="14" />
              {{ 'common.actions.openMap' | translate }}
            </a>
          </div>
        </div>

        <div class="flex flex-col gap-1.5">
          <label hlmLabel for="digitalAddress">{{ "common.fields.digitalAddress" | translate }}</label>
          <input hlmInput id="digitalAddress" placeholder="+00-00 ABC-DEFG"
            formControlName="digitalAddress" class="w-full uppercase font-mono" (input)="onDigitalAddressInput($event)" />
          @if (digitalAddressError()) {
            <div class="text-destructive text-xs font-medium animate-in fade-in mt-1">
              {{ digitalAddressError() }}
            </div>
          }
        </div>
      </div>
    }
  </div>

  <div class="flex flex-col gap-1">
    <lib-phone-form-group [formGroup]="form" />
    <span class="text-[10px] text-muted-foreground -mt-1 ml-1">({{ 'common.optional' | translate }})</span>
  </div>

  <lib-country-select [formGroup]="form" />

  <div class="flex justify-end pt-4">
    <button
      hlmBtn
      [attr.aria-label]="'pages.profile.edit.personal.buttons.save' | translate"
    >
      {{ "pages.profile.edit.personal.buttons.save" | translate }}
    </button>
  </div>
</form>
