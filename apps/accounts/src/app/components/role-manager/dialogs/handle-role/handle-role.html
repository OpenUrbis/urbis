<lib-loading-content [loading]="loading()">
  <h2 class="text-lg font-semibold mb-4">{{ title }}</h2>

  <div class="max-h-[80vh] overflow-y-auto p-1">
    <form [formGroup]="form" class="flex flex-col gap-4">
      <div class="flex flex-col gap-1.5">
        <label hlmLabel for="name">{{ "pages.roles.form.fields.name" | translate }}</label>
        <input hlmInput id="name" formControlName="name" class="w-full" />
      </div>

      <div class="flex flex-col gap-1.5">
        <label hlmLabel for="description">{{ "pages.roles.form.fields.description" | translate }}</label>
        <input hlmInput id="description" formControlName="description" class="w-full" />
      </div>

      <div class="flex items-center space-x-2">
          <hlm-switch id="isDefault" formControlName="isDefault" />
          <label hlmLabel for="isDefault">{{ "components.roleManager.default" | translate }}</label>
      </div>

      <div class="flex flex-col gap-2">
        <label hlmLabel>{{ "pages.roles.form.fields.permissions" | translate }}</label>

        <div class="relative">
            <hlm-icon name="lucideSearch" size="16" class="absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground" />
            <input
                hlmInput
                [formControl]="searchPermissions"
                placeholder="{{ 'pages.roles.form.placeholders.permissions' | translate }}"
                class="pl-9 w-full"
            />
        </div>

        <div class="border border-border rounded-md max-h-64 overflow-y-auto mt-1 p-2 bg-background/50 flex flex-col gap-2" *ngIf="permissions()?.length">
          @for (prm of permissions(); track prm.id) {
            <div class="flex items-start justify-between gap-3 p-2.5 rounded-md hover:bg-muted/30 border border-border/50 transition-colors">
              <label class="flex items-start gap-3 flex-1 cursor-pointer select-none">
                <input
                  type="checkbox"
                  [checked]="isPermissionSelected(prm.id)"
                  (change)="togglePermission(prm)"
                  class="w-4 h-4 mt-0.5 text-primary cursor-pointer rounded border-input focus:ring-0 focus:ring-offset-0"
                />
                <div class="flex flex-col flex-1">
                  <span class="font-semibold text-sm text-foreground">{{ prm.name }}</span>
                  <span class="text-xs text-muted-foreground mt-0.5">{{ prm.description }}</span>
                </div>
              </label>

              @if (isPermissionSelected(prm.id)) {
                <div class="flex items-center gap-1.5 self-center min-w-[130px]">
                  <select
                    class="bg-transparent border border-border rounded-md px-2 py-1 text-xs font-semibold focus:ring-1 focus:ring-primary focus:outline-none cursor-pointer h-8 w-full"
                    [value]="getSelectedPermissionScope(prm.id)"
                    (change)="changePermissionScope(prm.id, $event)"
                  >
                    <option value="global">{{ "pages.roles.form.scopeOptions.global" | translate }}</option>
                    <option value="any">{{ "pages.roles.form.scopeOptions.any" | translate }}</option>
                    <option value="own">{{ "pages.roles.form.scopeOptions.own" | translate }}</option>
                  </select>
                </div>
              }
            </div>
          }
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-4">
        <button hlmBtn variant="outline" type="button" (click)="dialogRef.close()">
            {{ "pages.roles.form.buttons.cancel" | translate }}
        </button>
        <lib-loading-button [loading]="loading()" (click)="save()">
            {{ "pages.roles.form.buttons.save" | translate }}
        </lib-loading-button>
      </div>
    </form>
  </div>
</lib-loading-content>
