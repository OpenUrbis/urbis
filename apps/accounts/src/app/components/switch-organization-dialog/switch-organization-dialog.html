<div class="flex items-center justify-between mb-4">
  <h2 class="text-lg font-semibold">
    {{ "components.switchOrganizationDialog.title" | translate }}
  </h2>
  <button
    type="button"
    class="text-muted-foreground hover:text-foreground p-1 rounded-full hover:bg-muted transition-colors focus:outline-none"
    (click)="cancel()"
    aria-label="Fechar"
  >
    <hlm-icon name="lucideX" size="20" />
  </button>
</div>

<div>
  <app-organization-switcher
    [disableAutoSelect]="true"
    (selected)="onSelect($event)"
  />
</div>

<div class="flex items-center justify-end gap-2 mt-6 border-t pt-4">
  <button
    type="button"
    class="px-4 py-2 text-sm font-medium border border-input bg-background hover:bg-muted rounded-md transition-colors"
    (click)="cancel()"
  >
    Cancelar
  </button>
  <button
    type="button"
    class="px-4 py-2 text-sm font-medium bg-primary text-primary-foreground hover:bg-primary/90 rounded-md transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
    [disabled]="!selectedOrg"
    (click)="confirm()"
  >
    Confirmar
  </button>
</div>
