<form [formGroup]="form" (ngSubmit)="send()" class="flex flex-col gap-4">
  <div class="flex flex-col gap-1.5">
    <label hlmLabel for="otp">{{ "components.twoFactorVerify.label" | translate }}</label>
    <input hlmInput id="otp" placeholder="{{ 'components.twoFactorVerify.placeholder' | translate }}"
      [formControl]="otp" class="w-full" />
  </div>

  <div class="flex justify-end gap-2">
    <lib-loading-button [loading]="loading()"
      [attr.aria-label]="'components.twoFactorVerify.buttons.validate' | translate" class="w-full sm:w-auto">
      {{ "components.twoFactorVerify.buttons.validate" | translate }}
    </lib-loading-button>
  </div>
</form>
