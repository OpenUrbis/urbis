<lib-loading-content [loading]="loading()">
  <app-page-structure
    [title]="'components.userOrganizationManager.page.title' | translate"
    [containerClasses]="[]"
  >
    <section rightActions>
      <button
      *hasPermission="'role:assign'"
        hlmBtn
        [attr.aria-label]="
          'components.userOrganizationManager.page.buttons.add.ariaLabel'
            | translate
        "
        (click)="handleAssign()"
      >
        <hlm-icon name="lucidePlus" size="sm" class="mr-2" />
        {{
          "components.userOrganizationManager.page.buttons.add.title"
            | translate
        }}
      </button>
    </section>

    <div class="rounded-md border border-border divide-y divide-border">
      @for (item of organizations(); track item.id) {
        <div class="flex items-center justify-between p-4 hover:bg-muted/50 transition-colors">
          <div class="flex flex-col gap-1">
            <span class="font-medium text-sm">{{ item.name }}</span>
            
            @if (item.description) {
              <span class="text-xs text-muted-foreground">{{ item.description }}</span>
            }
            
            <span class="text-xs text-muted-foreground">
              {{ buildRoles(item) }}
            </span>
          </div>
 
          <button
            *hasPermission="'role:assign'"
            hlmBtn
            variant="ghost"
            size="icon"
            [attr.aria-label]="
              'components.userOrganizationManager.page.buttons.edit.ariaLabel'
                | translate
            "
            (click)="handleAssign(item)"
          >
            <hlm-icon name="lucidePencil" size="sm" />
          </button>
        </div>
      }
    </div>
  </app-page-structure>
</lib-loading-content>
