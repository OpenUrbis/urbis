<div
  class="container w-100 h-100 d-flex justify-content-center align-items-center"
>
  <mat-card>
    <mat-card-header>
      <mat-card-title>
        {{ "pages.confirmAccount.title" | translate }}
      </mat-card-title>
    </mat-card-header>
    <mat-card-content>
      @if (error()) {
        <p>{{ error() }}</p>
      } @else if (loading()) {
        <p>{{ "pages.confirmAccount.loading" | translate }}</p>
      } @else {
        <p>{{ "pages.confirmAccount.success" | translate }}</p>
      }
    </mat-card-content>
  </mat-card>
</div>
