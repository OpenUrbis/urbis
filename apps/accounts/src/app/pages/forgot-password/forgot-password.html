<div class="flex items-center justify-center min-h-[calc(100vh-64px)] w-full bg-background text-foreground p-4 overflow-y-auto">
  <div class="w-full max-w-[400px] border border-border rounded-xl p-5 sm:p-6 bg-card text-card-foreground">
    <form (ngSubmit)="submit()" [formGroup]="form" class="w-full">
      <section class="w-full bg-transparent flex flex-col gap-4">
        <header class="flex flex-row items-center gap-2 pb-1">
          <a hlmBtn variant="ghost" size="icon" [attr.aria-label]="'pages.forgotPassword.buttons.back' | translate"
            href="/" class="shrink-0 rounded-full h-8 w-8">
            <hlm-icon name="lucideArrowLeft" size="18" />
          </a>
          <div class="flex flex-col gap-0.5">
            <h1 class="text-xl font-bold tracking-tight text-primary">
              {{ "pages.forgotPassword.title" | translate }}
            </h1>
          </div>
        </header>

        <div class="flex flex-col gap-3.5">
          <p class="text-xs text-muted-foreground leading-relaxed">
            {{ "pages.forgotPassword.description" | translate }}
          </p>

          <div class="flex flex-col gap-1.5">
            <label hlmLabel for="email" class="text-xs text-foreground">{{ "pages.forgotPassword.fields.email" | translate }}</label>
            <input hlmInput id="email" type="email"
              placeholder="{{ 'pages.forgotPassword.placeholders.email' | translate }}" formControlName="email"
              class="w-full h-9 text-sm bg-background text-foreground" />
          </div>
        </div>

        <div class="pt-1">
          <button hlmBtn class="w-full font-semibold h-9 text-sm" [disabled]="form.invalid || loading"
            [attr.aria-label]="'pages.forgotPassword.buttons.submit' | translate">
            @if (loading) {
              <hlm-icon name="lucideLoader2" size="16" class="animate-spin" />
              {{ "pages.forgotPassword.buttons.sending" | translate }}
            } @else {
              {{ "pages.forgotPassword.buttons.submit" | translate }}
            }
          </button>
        </div>
      </section>
    </form>
  </div>
</div>
