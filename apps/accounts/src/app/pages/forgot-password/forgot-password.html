<div class="flex items-center justify-center min-h-[calc(100vh-64px)] w-full bg-background p-1 sm:p-2 overflow-y-auto">
  <div class="w-full max-w-[448px]">
    <form (ngSubmit)="submit()" [formGroup]="form" class="w-full">
      <section hlmCard class="w-full shadow-lg border-border">
        <header hlmCardHeader class="pt-6 pb-2 flex flex-row items-center gap-2">
          <a hlmBtn variant="ghost" size="icon" [attr.aria-label]="'pages.forgotPassword.buttons.back' | translate"
            href="/" class="shrink-0 rounded-full h-8 w-8">
            <hlm-icon name="lucideArrowLeft" size="18" />
          </a>
          <div class="flex flex-col gap-0.5">
            <h1 hlmCardTitle class="text-xl font-bold tracking-tight text-primary">
              {{ "pages.forgotPassword.title" | translate }}
            </h1>
          </div>
        </header>

        <div hlmCardContent class="flex flex-col gap-3 p-6 pt-2">
          <p hlmCardDescription class="text-xs text-muted-foreground leading-relaxed">
            {{ "pages.forgotPassword.description" | translate }}
          </p>

          <div class="flex flex-col gap-1.5">
            <label hlmLabel for="email" class="text-xs">{{ "pages.forgotPassword.fields.email" | translate }}</label>
            <input hlmInput id="email" type="email"
              placeholder="{{ 'pages.forgotPassword.placeholders.email' | translate }}" formControlName="email"
              class="w-full h-9 text-sm" />
          </div>
        </div>

        <div hlmCardFooter class="pt-0 p-6">
          <button hlmBtn class="w-full font-semibold h-9 text-sm" [disabled]="form.invalid"
            [attr.aria-label]="'pages.forgotPassword.buttons.submit' | translate">
            {{ "pages.forgotPassword.buttons.submit" | translate }}
          </button>
        </div>
      </section>
    </form>
  </div>
</div>
