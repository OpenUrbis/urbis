<div class="row justify-content-center align-items-center h-100">
  <div class="col-10 col-xl-3 col-lg-4 col-md-6 sign-in-container">
    <form
      (ngSubmit)="submit()"
      class="d-flex justify-content-center align-items-center flex-column"
      [formGroup]="form"
      class="h-100 w-100"
    >
      <mat-card class="py-3">
        <mat-card-header class="pt-0 d-flex flex-column">
          <div class="d-flex flex-row align-items-center">
            <a
              matCardAvatar
              matIconButton
              [attr.aria-label]="'pages.forgotPassword.buttons.back' | translate"
              href="/"
              class="me-3"
            >
              <mat-icon class="material-symbols-outlined">arrow_back</mat-icon>
            </a>
            <h1 matCardTitle class="mb-3">
              {{ "pages.forgotPassword.title" | translate }}
            </h1>
          </div>
          <div class="d-flex flex-column gap-3">
            <p matCardSubTitle>
              {{ "pages.forgotPassword.description" | translate }}
            </p>
          </div>
        </mat-card-header>
        <mat-card-content class="d-flex flex-column">
          <mat-form-field appearance="outline">
            <mat-label>{{
              "pages.forgotPassword.fields.email" | translate
            }}</mat-label>
            <input
              matInput
              type="email"
              [placeholder]="
                'pages.forgotPassword.placeholders.email' | translate
              "
              [attr.aria-label]="
                'pages.forgotPassword.fields.email' | translate
              "
              formControlName="email"
            />
          </mat-form-field>
        </mat-card-content>
        <mat-card-actions
          class="justify-content-center align-items-center d-flex flex-column px-3 gap-3"
        >
          <button
            matButton="filled"
            class="w-100"
            [disabled]="form.invalid"
            [attr.aria-label]="'pages.forgotPassword.buttons.submit' | translate"
          >
            {{ "pages.forgotPassword.buttons.submit" | translate }}
          </button>
        </mat-card-actions>
      </mat-card>
    </form>
  </div>
</div>
