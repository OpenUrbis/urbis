<div class="flex items-center justify-center min-h-[calc(100vh-64px)] w-full bg-background text-foreground p-4 overflow-y-auto">
  <div class="w-full max-w-[400px]">
    <div class="flex justify-center mb-6">
      <lib-logo />
    </div>

    <div class="w-full border border-border rounded-xl p-5 sm:p-6 bg-card text-card-foreground">
      <section class="w-full bg-transparent flex flex-col gap-4">
        <header class="pb-1">
          <h1 class="text-xl font-bold tracking-tight text-primary m-0">
            {{ "pages.forgotPassword.reset.title" | translate }}
          </h1>
        </header>

        <div>
          <form [formGroup]="form">
            <lib-password-form-group [formGroup]="form" />
          </form>
        </div>

        <div class="pt-1">
          <button hlmBtn class="w-full font-semibold h-9 text-sm" (click)="submit()" [attr.aria-label]="
              'pages.forgotPassword.reset.buttons.submit' | translate
            ">
            {{ "pages.forgotPassword.reset.buttons.submit" | translate }}
          </button>
        </div>
      </section>
    </div>
  </div>
</div>
