<div class="flex items-center justify-center min-h-[calc(100vh-64px)] w-full bg-background p-4 sm:p-6">
  <div class="w-full max-w-[400px]">
    <div class="flex justify-center mb-6">
      <lib-logo />
    </div>

    <section hlmCard class="w-full shadow-lg border-border">
      <header hlmCardHeader class="p-6 pb-2">
        <h1 hlmCardTitle class="text-xl font-bold tracking-tight text-primary">
          {{ "pages.forgotPassword.reset.title" | translate }}
        </h1>
      </header>

      <div hlmCardContent class="p-6 pt-2">
        <form [formGroup]="form">
          <lib-password-form-group [formGroup]="form" />
        </form>
      </div>

      <div hlmCardFooter class="pt-0 p-6">
        <button hlmBtn class="w-full font-semibold h-9 text-sm" (click)="submit()" [attr.aria-label]="
            'pages.forgotPassword.reset.buttons.submit' | translate
          ">
          {{ "pages.forgotPassword.reset.buttons.submit" | translate }}
        </button>
      </div>
    </section>
  </div>
</div>
