<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>
      {{ "pages.forgotPassword.reset.title" | translate }}
    </mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="form">
      <lib-password-form-group [formGroup]="form" />
    </form>
  </mat-card-content>
  <mat-card-actions>
    <button
      matButton="outlined"
      (click)="submit()"
      [attr.aria-label]="
        'pages.forgotPassword.reset.buttons.submit' | translate
      "
    >
      {{ "pages.forgotPassword.reset.buttons.submit" | translate }}
    </button>
  </mat-card-actions>
</mat-card>
