<div class="row justify-content-center align-items-center h-100">

    <mat-card class="py-3">
      <mat-card-header class="pt-0 d-flex flex-column text-center">
        <h1 class="mb-2" matCardTitle>
          {{ "pages.forgotPassword.sent.title" | translate }}
        </h1>
      </mat-card-header>
      <mat-card-content class="text-center mb-3">
        <p>
          {{ "pages.forgotPassword.sent.description" | translate }}
