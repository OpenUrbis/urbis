<lib-loading-content [loading]="loading()">
  <mat-card>
    <mat-card-header>
      <mat-card-title class="d-flex justify-content-start align-items-center">
        <a
          matIconButton
          aria-label="Editar organização"
          routerLink="/organizations"
          class="me-3"
        >
          <mat-icon class="material-symbols-outlined">arrow_back</mat-icon>
        </a>
        {{ name() ? name() : "Criar organização" }}
      </mat-card-title>
    </mat-card-header>
    <mat-card-content class="pt-3">
      <mat-tab-group mat-stretch-tabs="false" mat-align-tabs="start">
        <mat-tab label="Dados da organizações">
          <form
            [formGroup]="form"
            (ngSubmit)="save()"
            class="p-3 d-flex flex-column gap-2"
          >
            <mat-form-field appearance="outline">
              <mat-label>Nome</mat-label>
              <input matInput formControlName="name" />
            </mat-form-field>

            <mat-form-field appearance="outline">
              <mat-label>Descrição</mat-label>
              <input matInput formControlName="description" />
            </mat-form-field>

            <lib-loading-button [loading]="loadingSave()">
              Salvar
            </lib-loading-button>
          </form>
        </mat-tab>
        @if (id()) {
          <mat-tab label="Usuários">
            <div class="p-3">TO DO!</div>
          </mat-tab>
        }
      </mat-tab-group>
    </mat-card-content>
  </mat-card>
</lib-loading-content>
