<lib-loading-content [loading]="profileState.loading()">
  <div class="profile-content">
    <mat-card>
      <mat-card-header>
        <h2>Editar Perfil</h2>
      </mat-card-header>
      <mat-card-content>
        <mat-tab-group mat-align-tabs="start">
          <mat-tab label="Dados pessoais">
            <app-personal-data-form />
          </mat-tab>

          <mat-tab label="Alterar senha">
            <app-change-password-form />
          </mat-tab>
        </mat-tab-group>
      </mat-card-content>
    </mat-card>
  </div>
</lib-loading-content>
