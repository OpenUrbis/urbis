<lib-loading-content [loading]="profileState.loading()">
  <app-page-structure [title]="'pages.profile.edit.pageTitle' | translate">
    <section leftActions>
      <a
        matIconButton
        [attr.aria-label]="'pages.profile.edit.actions.back' | translate"
        routerLink="/profile"
        class="me-3"
      >
        <mat-icon class="material-symbols-outlined">arrow_back</mat-icon>
      </a>
    </section>

    <mat-tab-group
      [(selectedIndex)]="selectedTabIndex"
      mat-stretch-tabs="false"
      mat-align-tabs="start"
      dynamicHeight
    >
      <mat-tab [label]="'pages.profile.edit.tabs.personalData' | translate">
        <mat-card class="my-3">
          <mat-card-content>
            <app-personal-data-form />
          </mat-card-content>
        </mat-card>
      </mat-tab>

      <mat-tab [label]="'pages.profile.edit.tabs.changePassword' | translate">
        <mat-card class="my-3">
          <mat-card-content>
            <app-change-password-form />
          </mat-card-content>
        </mat-card>
      </mat-tab>

      <mat-tab [label]="'pages.profile.edit.tabs.twoFactor' | translate">
        <mat-card class="my-3">
          <mat-card-content>
            <app-two-factor-manager [user]="profileState.value()" />
          </mat-card-content>
        </mat-card>
      </mat-tab>
    </mat-tab-group>
  </app-page-structure>
</lib-loading-content>
