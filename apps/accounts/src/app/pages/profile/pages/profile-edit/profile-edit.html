<lib-loading-content [loading]="profileState.loading()">
  <div class="max-w-3xl mx-auto p-4 md:p-6 space-y-6">
    <!-- Header -->
    <div class="flex flex-col gap-6">
       <div class="flex items-center gap-3">
          <a hlmBtn variant="ghost" size="icon" routerLink="/profile" class="-ml-2">
             <hlm-icon name="lucideArrowLeft" size="18" />
          </a>
          <h1 class="text-xl font-semibold tracking-tight">{{ 'pages.profile.edit.pageTitle' | translate }}</h1>
       </div>

       <!-- Tabs -->
       <div class="inline-flex h-10 items-center justify-start rounded-lg bg-muted p-1 text-muted-foreground w-full sm:w-fit">
          <button 
             type="button"
             class="inline-flex flex-1 sm:flex-none items-center justify-center whitespace-nowrap rounded-md px-3 py-1.5 text-sm font-medium ring-offset-background transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50"
             [class.bg-background]="selectedTabIndex() === 0"
             [class.text-foreground]="selectedTabIndex() === 0"
             [class.shadow-sm]="selectedTabIndex() === 0"
             (click)="selectedTabIndex.set(0)">
             {{ 'pages.profile.edit.tabs.personalData' | translate }}
          </button>
          
          <button 
             type="button"
             class="inline-flex flex-1 sm:flex-none items-center justify-center whitespace-nowrap rounded-md px-3 py-1.5 text-sm font-medium ring-offset-background transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50"
             [class.bg-background]="selectedTabIndex() === 1"
             [class.text-foreground]="selectedTabIndex() === 1"
             [class.shadow-sm]="selectedTabIndex() === 1"
             (click)="selectedTabIndex.set(1)">
             {{ 'pages.profile.edit.tabs.changePassword' | translate }}
          </button>

          <button 
             type="button"
             class="inline-flex flex-1 sm:flex-none items-center justify-center whitespace-nowrap rounded-md px-3 py-1.5 text-sm font-medium ring-offset-background transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50"
             [class.bg-background]="selectedTabIndex() === 2"
             [class.text-foreground]="selectedTabIndex() === 2"
             [class.shadow-sm]="selectedTabIndex() === 2"
             (click)="selectedTabIndex.set(2)">
             {{ 'pages.profile.edit.tabs.twoFactor' | translate }}
          </button>
       </div>
    </div>

    <!-- Tab Content -->
    <div class="mt-2">
        @if (selectedTabIndex() === 0) {
            <div class="border border-border rounded-lg bg-card p-6 shadow-sm animate-in fade-in-50 slide-in-from-bottom-2 duration-300">
                <app-personal-data-form />
            </div>
        }

        @if (selectedTabIndex() === 1) {
            <div class="border border-border rounded-lg bg-card p-6 shadow-sm animate-in fade-in-50 slide-in-from-bottom-2 duration-300">
                <app-change-password-form />
            </div>
        }

        @if (selectedTabIndex() === 2) {
            <div class="border border-border rounded-lg bg-card p-6 shadow-sm animate-in fade-in-50 slide-in-from-bottom-2 duration-300">
                <app-two-factor-manager [user]="profileState.value()" />
            </div>
        }
    </div>
  </div>
</lib-loading-content>
