<lib-loading-content [loading]="profileState.loading()">
  <div class="profile-content">
    <mat-card>
      <mat-card-header>
        <h2>Editar Perfil</h2>
      </mat-card-header>
      <mat-card-content>
        <form [formGroup]="form" class="profile-form" (ngSubmit)="submit()">
          <mat-form-field>
            <mat-label>Primeiro nome</mat-label>
            <input matInput formControlName="firstName" />
          </mat-form-field>

          <mat-form-field>
            <mat-label>Ultimo nome</mat-label>
            <input matInput formControlName="lastName" />
          </mat-form-field>

          <button matButton="filled">Salvar</button>
        </form>
      </mat-card-content>
    </mat-card>
  </div>
</lib-loading-content>
