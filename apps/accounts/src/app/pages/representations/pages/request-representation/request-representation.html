<section class="max-w-md mx-auto py-8">
  <div hlmCard>
    <div hlmCardHeader>
      <h3 hlmCardTitle>
        {{ "representations.request.title" | translate }}
      </h3>
    </div>
    <div hlmCardContent>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="mb-4">
          <label hlmLabel for="document">
            {{ "representations.request.form.document" | translate }}
          </label>
          <input
            hlmInput
            id="document"
            formControlName="document"
            [placeholder]="
              'representations.request.form.documentPlaceholder' | translate
            "
            (input)="onDocumentInput($event)"
            (blur)="checkDocument()"
            maxlength="18"
          />
        </div>

        @if (isDirectAccess()) {
          <div class="mb-4 p-4 bg-green-100 text-green-800 rounded">
            <p>
              {{ "representations.request.form.directAccess" | translate }}
            </p>
          </div>
        }

        <div class="mb-4">
          <label hlmLabel for="justification">
            {{ "representations.request.form.justification" | translate }}
          </label>
          <textarea
            hlmInput
            id="justification"
            formControlName="justification"
            rows="8"
            class="w-full h-auto"
          ></textarea>
          <div class="mt-4">
            <lib-attachments formControlName="documents" />
          </div>
        </div>

        <div class="flex justify-end gap-2">
          <button hlmBtn variant="outline" routerLink="..">
            {{ "representations.request.buttons.cancel" | translate }}
          </button>
          <button hlmBtn [disabled]="loading() || form.invalid">
            {{
              loading()
                ? ("representations.request.buttons.submitting" | translate)
                : ("representations.request.buttons.submit" | translate)
            }}
          </button>
        </div>
      </form>
    </div>
  </div>
</section>
