<div class="flex items-center justify-center min-h-[calc(100vh-64px)] w-full bg-background p-2 sm:p-2 overflow-y-auto">
  <div class="w-full max-w-[380px]">
    <form (ngSubmit)="onSubmit()" [formGroup]="formGroup" class="w-full">
      <section hlmCard class="w-full border-border bg-white dark:bg-card">
        <header hlmCardHeader class="pb-2">
          <h1 hlmCardTitle class="text-xl m-0 p-0 font-bold text-primary">
            {{ "pages.signIn.title" | translate }}
          </h1>
          
          <p class="text-xs italic text-muted-foreground mt-2">
  {{ "pages.auth.attention" | translate }}
</p>
        </header>

        <div hlmCardContent class="flex flex-col gap-3 pt-3">
          <div class="flex flex-col gap-1.5">
            <label hlmLabel for="email" class="text-xs text-foreground">{{ "pages.signIn.form.fields.email" | translate }}</label>
            <input hlmInput id="email" type="email"
              placeholder="{{ 'pages.signIn.form.placeholders.email' | translate }}" formControlName="email"
              class="w-full h-9 text-sm bg-background text-foreground" />
          </div>

          <div class="flex flex-col gap-1.5">
            <label hlmLabel for="password" class="text-xs text-foreground">{{ "pages.signIn.form.fields.password" | translate }}</label>
            <input hlmInput id="password" type="password"
              placeholder="{{ 'pages.signIn.form.placeholders.password' | translate }}" formControlName="password"
              class="w-full h-9 text-sm bg-background text-foreground" />
          </div>

          <div class="flex justify-end">
            <a hlmBtn variant="outline" size="sm" href="/forgot-password"
              class="text-xs font-medium no-underline">
              {{ "pages.signIn.form.links.forgotPassword" | translate }}
            </a>
          </div>
        </div>

        <div hlmCardFooter class="flex flex-col gap-3 pt-0">
          <button hlmBtn class="w-full font-semibold h-9 text-sm" [disabled]="formGroup.invalid">
            {{ "pages.signIn.form.buttons.submit" | translate }}
          </button>

          <a hlmBtn variant="outline" href="/sign-up" class="w-full font-semibold h-9 text-sm no-underline">
            {{ "pages.signIn.form.links.signUp" | translate }}
          </a>

          <div class="relative py-1">
            <div class="absolute inset-0 flex items-center">
              <span class="w-full border-t border-border"></span>
            </div>
            <div class="relative flex justify-center text-[10px] uppercase">
              <span class="bg-card px-2 text-muted-foreground">
                {{ "pages.signIn.form.divider" | translate }}
              </span>
            </div>
          </div>

          <lib-sign-in-gov-br-btn (click)="signInWithExternalOidc()" class="w-full" />
        </div>
      </section>
    </form>
  </div>
</div>
