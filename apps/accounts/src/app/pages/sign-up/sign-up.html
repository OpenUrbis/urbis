<div class="flex items-center justify-center min-h-[calc(100vh-64px)] w-full bg-background p-4 sm:p-6 overflow-y-auto">
  <div class="w-full max-w-[424px]">
    <form (ngSubmit)="submit()" [formGroup]="formGroup" class="w-full">
      <section hlmCard class="w-full border-border">
        <header hlmCardHeader class="pt-0 pb-0 flex flex-row items-center gap-0">
          <a hlmBtn variant="ghost" size="icon" [attr.aria-label]="'pages.signUp.actions.back' | translate" href="/"
            class="shrink-0 rounded-full h-8 w-8 mt-2">
            <hlm-icon name="lucideArrowLeft" size="18" />
          </a>
          <h1 hlmCardTitle class="text-xl ml-4 mt-0 font-bold tracking-tight text-primary">
            {{ "pages.signUp.title" | translate }}
          </h1>
        </header>

        <div hlmCardContent class="flex flex-col gap-3 p-1 pt-2">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div class="flex flex-col gap-1.5">
              <label hlmLabel for="firstName" class="text-xs">{{ "pages.signUp.form.fields.firstName" | translate }}</label>
              <input hlmInput id="firstName" placeholder="{{ 'pages.signUp.form.fields.firstName' | translate }}"
                formControlName="firstName" class="w-full h-9 text-sm" />
            </div>
            <div class="flex flex-col gap-1.5">
              <label hlmLabel for="lastName" class="text-xs">{{ "pages.signUp.form.fields.lastName" | translate }}</label>
              <input hlmInput id="lastName" placeholder="{{ 'pages.signUp.form.fields.lastName' | translate }}"
                formControlName="lastName" class="w-full h-9 text-sm" />
            </div>
          </div>

          <div class="flex flex-col gap-1.5">
            <label hlmLabel for="email" class="text-xs">{{ "pages.signUp.form.fields.email" | translate }}</label>
            <input hlmInput id="email" type="email" placeholder="{{ 'pages.signUp.form.fields.email' | translate }}"
              formControlName="email" class="w-full h-9 text-sm" />
          </div>

          <lib-country-select [formGroup]="formGroup" />

          <lib-phone-form-group [formGroup]="formGroup" />

          <lib-password-form-group [formGroup]="formGroup" />
        </div>

        <div class="flex items-center p-1 pt-0">
          <button hlmBtn class="w-full font-semibold h-9 text-sm" [disabled]="formGroup.invalid"
            [attr.aria-label]="'pages.signUp.form.buttons.submit' | translate">
            {{ "pages.signUp.form.buttons.submit" | translate }}
          </button>
        </div>
      </section>
    </form>
  </div>
</div>
