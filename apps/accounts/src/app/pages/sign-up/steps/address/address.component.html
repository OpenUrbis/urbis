<div class="flex flex-col h-full space-y-6 animate-in fade-in duration-500">
  <div class="flex flex-col space-y-1 text-center sm:text-left">
    <h2 class="text-xl font-bold tracking-tight">Endereço</h2>
    <p class="text-sm text-muted-foreground">
      Preencha os dados do seu endereço.
    </p>
  </div>

  <div [formGroup]="formGroup" class="flex flex-col gap-4 flex-1 overflow-y-auto pr-2 custom-scrollbar">
    <app-user-form
      [formGroup]="formGroup"
      displayMode="address"
      [noOfficialAddress]="noOfficialAddress"
      (noOfficialAddressChange)="noOfficialAddressChange.emit($event)"
    />
    <lib-country-select [formGroup]="formGroup" />
  </div>

  <div class="pt-2 flex justify-between gap-3">
    <button hlmBtn variant="ghost" class="w-1/3" (click)="back.emit()">Voltar</button>
    <button hlmBtn class="w-2/3" (click)="next.emit()">Continuar</button>
  </div>
</div>
