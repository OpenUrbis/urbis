<div class="flex flex-col h-full space-y-6 animate-in fade-in duration-500">
  <div class="flex flex-col space-y-1 text-center sm:text-left">
    <h2 class="text-xl font-bold tracking-tight">Dados Pessoais</h2>
    <p class="text-sm text-muted-foreground">
      Entre com sua conta Gov.br para preencher seus dados de forma segura.
    </p>
  </div>

  <div
    [formGroup]="formGroup"
    class="flex flex-col gap-4 flex-1 overflow-y-auto pr-2 custom-scrollbar"
  >
    @if (!hasGovBrData) {
      <div
        class="flex flex-col items-center justify-center p-6 border border-dashed border-border rounded-lg bg-muted/10 gap-4"
      >
        <div class="text-center">
          <h3 class="font-semibold text-lg">Validação de Identidade</h3>
          <p class="text-sm text-muted-foreground mt-1 max-w-[300px] mx-auto">
            Para prosseguir com o cadastro da conta do tipo selecionado, é
            obrigatório autenticar pelo Gov.br.
          </p>
        </div>

        <div class="w-full max-w-[280px] mt-2">
          <lib-sign-in-gov-br-btn type="button" (click)="govBrLogin.emit()" />
        </div>
      </div>
    } @else {
      <div class="mb-4">
        <h3
          class="text-sm font-semibold flex items-center gap-2 text-primary bg-muted/20 border border-border rounded-lg p-4"
        >
          <hlm-icon name="lucideCheck" size="16" />
          Dados autenticados via Gov.br
        </h3>
      </div>

      <app-user-form [formGroup]="formGroup" displayMode="personal" />
    }
  </div>

  <div class="pt-2 flex justify-between gap-3">
    <button hlmBtn variant="ghost" class="w-1/3" (click)="back.emit()">
      Voltar
    </button>
    <button
      hlmBtn
      class="w-2/3"
      [disabled]="!hasGovBrData || !formGroup.get('birthDate')?.value || formGroup.get('birthDate')?.invalid"
      (click)="next.emit()"
    >
      Continuar
    </button>
  </div>
</div>
