version: '3.9'

services:
  postgres:
    image: postgres:16.2
    container_name: postgres
    ports:
      - ${DATABASE_PORT}:5432
    volumes:
      - ./.data/db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    networks:
      - app-network

  redis:
    image: redis:7.2
    container_name: redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --databases 16
    ports:
      - ${REDIS_PORT}:6379
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - ./.data/redis:/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
