<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sair</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
            color: #333;
        }
        .container {
            text-align: center;
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }
        button {
            background-color: #0078d4;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 20px;
        }
        button:hover {
            background-color: #005a9e;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #0078d4;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="ui" class="container">
        <h2>Você saiu do sistema</h2>
        <p>Clique em continuar para encerrar sua sessão em todos os aplicativos.</p>
        <button id="btn-continue">Continuar</button>
    </div>
    <div id="loader" class="container hidden">
        <h2>Saindo...</h2>
        <div class="loader"></div>
        <p>Por favor, aguarde.</p>
    </div>

    <script>
        const apps = [
            { prod: 'https://conta.urbis.prefeitura.sp.gov.br', local: 'http://localhost:4200' },
            { prod: 'https://mapa.urbis.prefeitura.sp.gov.br', local: 'http://localhost:5173' },
            { prod: 'https://urbis.prefeitura.sp.gov.br', local: 'http://localhost:5174' },
            { prod: 'https://docs.urbis.prefeitura.sp.gov.br', local: 'http://localhost:3010' },
            { prod: 'https://conta.urbis.sampa.br', local: 'http://localhost:4200' },
            { prod: 'https://mapa.urbis.sampa.br', local: 'http://localhost:5173' },
            { prod: 'https://urbis.sampa.br', local: 'http://localhost:5174' },
            { prod: 'https://docs.urbis.sampa.br', local: 'http://localhost:3010' },
        ];

        const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const isIframe = window.top !== window.self;

        function doLocalLogout() {
            try {
                Object.keys(localStorage).forEach(key => {
                    if (key.startsWith('oidc')) {
                        localStorage.removeItem(key);
                    }
                });

                localStorage.setItem("logout", Date.now());
                sessionStorage.clear();
                console.log("Local logout executed.");
            } catch (e) {
                console.error("Logout error:", e);
            }
        }

        if (isIframe) {
            document.getElementById('ui').style.display = 'none';
            doLocalLogout();
        } else {
            document.getElementById('btn-continue').addEventListener('click', () => {
                document.getElementById('ui').classList.add('hidden');
                document.getElementById('loader').classList.remove('hidden');

                doLocalLogout();

                const currentHost = window.location.host;
                
                apps.forEach(app => {
                    const url = isLocal ? app.local : app.prod;
                    if (url && !url.includes(currentHost)) { 
                        const iframe = document.createElement('iframe');
                        iframe.src = url + '/logout.html';
                        iframe.style.display = 'none';
                        iframe.width = '1';
                        iframe.height = '1';
                        document.body.appendChild(iframe);
                    }
                });

                setTimeout(() => {
                    if (isLocal) {
                        window.location.href = 'http://localhost:5174';
                    } else {
                        window.location.href = 'https://urbis.sampa.br';
                    }
                }, 2000);
            });
        }
    </script>
</body>
</html>
