apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ .Values.certManager.issuerName | default "urbis-issuer" }}
  namespace: {{ .Release.Namespace | default "urbis-map" }}
spec:
  acme:
    server: {{ .Values.certManager.server | default "https://acme-v02.api.letsencrypt.org/directory" }}
    email: {{ .Values.certManager.email | default "admin@urbis.example.com" }}
    privateKeySecretRef:
      name: {{ .Values.certManager.issuerName | default "urbis-issuer" }}-key
    solvers:
    - http01:
        ingress:
          # IMPORTANTE: usar `ingressClassName` (campo spec.ingressClassName do ingress solver)
          # e NAO `class` (annotation legada kubernetes.io/ingress.class). O ingress-nginx
          # compara a annotation legada com `--ingress-class` do controller (aqui: `nginx`) e
          # ignora o solver quando nao coincidem; o desafio HTTP-01 cai na API (404) e o
          # certificado nao renova. Em 2026-11-06 isso derrubou o Mapa (erro M001001DS).
          # O valor deve ser o mesmo do IngressClass do ingress da API
          # (components-api-gateway: ingress.className).
          ingressClassName: {{ .Values.certManager.ingressClassName | default "nginx-map" }}
