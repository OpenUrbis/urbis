apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: urbis-map-api
  namespace: urbis-map
  annotations:
    external-dns.alpha.kubernetes.io/hostname: {{ .Values.domainName }}
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "2g"
    cert-manager.io/issue-temporary-certificate: "true"
spec:
  ingressClassName: nginx-map
  tls:
    - hosts:
        - {{ .Values.domainName }}
      secretName: urbis-map-certificate-tls
  rules:
    - host: {{ .Values.domainName }}
      http:
        paths:
          - path: /storage/(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: urbis-map-storage-service
                port:
                  number: 8080
          - path: /storage
            pathType: ImplementationSpecific
            backend:
              service:
                name: urbis-map-storage-service
                port:
                  number: 8080
          - path: /(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: urbis-map-api-service
                port:
                  number: 3000