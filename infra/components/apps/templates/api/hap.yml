apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: urbis-map-api-hpa
  namespace: urbis-map
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: urbis-map-api
  minReplicas: 1
  maxReplicas: 1
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 30